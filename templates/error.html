<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
    <title>Error {% if code %}{{ code }}{% endif %} — YT Downloader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="light-mode">
    <div class="container" style="text-align:center; padding-top: 4rem;">
        <h1>{% if code %}{{ code }}{% else %}Error{% endif %}</h1>
        <p>{{ message if message else "Something went wrong." }}</p>
        <a href="/" class="primary-btn" style="display:inline-block; margin-top:1.5rem;">
            ← Go Home
        </a>
    </div>
</body>
</html>
